# Configuração local de referência para sonar-scanner.
# O Jenkinsfile passa os parâmetros principais via -D na linha de comando;
# este arquivo permite rodar a análise manualmente:
#
#   build-wrapper-linux-x86-64 --out-dir bw-output make lib
#   sonar-scanner

sonar.projectKey=libnn
sonar.projectName=libnn
sonar.projectVersion=0.6.0

sonar.sources=src,include
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Gerado pelo build-wrapper (caminho relativo ao workspace).
sonar.cfamily.build-wrapper-output=bw-output

# Análise C/C++: exclui gerados, artefatos e a galeria estática.
sonar.exclusions=docs/gallery/**,python/**,examples/**,src/*.o,*.a,*.so

sonar.cfamily.threads=2
sonar.cfamily.cache.enabled=true

# Cobertura: gerada por `make coverage` (gcov + lcov → XML genérico).
sonar.coverageReportPaths=coverage.xml
