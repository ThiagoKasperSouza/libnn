services:
  jenkins:
    build:
      context: ../..
      dockerfile: jenkins/local/Dockerfile
    image: libnn-jenkins-local:latest
    container_name: libnn-jenkins
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50000:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: "/usr/share/jenkins/ref/casc.yaml"
      LIBNN_REPO_URL: "${LIBNN_REPO_URL:-/workspace}"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Repo montado em /workspace (usado como SCM path no smoke).
      - ../..:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "973"
    restart: unless-stopped

volumes:
  jenkins_home:
